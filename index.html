<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Tracker Dashboard</title>
    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 p-4">
    <!-- Dashboard Section -->
    <section class="mb-8">
      <h1 class="text-2xl font-bold mb-4">Job Tracker Dashboard</h1>

      <!-- Dashboard Cards -->
      <div class="flex gap-4 mb-6">
        <div
          onclick="filterDashboard('All')"
          id="totalCard"
          class="dash-card flex-1 bg-white p-4 rounded shadow cursor-pointer text-center"
        >
          <h3 class="font-semibold">Total Jobs</h3>
          <p id="totalCount" class="text-xl font-bold mt-2">0</p>
        </div>
        <div
          onclick="filterDashboard('Interview')"
          id="interviewCard"
          class="dash-card flex-1 bg-white p-4 rounded shadow cursor-pointer text-center"
        >
          <h3 class="font-semibold">Interview</h3>
          <p id="interviewCount" class="text-xl font-bold mt-2">0</p>
        </div>
        <div
          onclick="filterDashboard('Rejected')"
          id="rejectedCard"
          class="dash-card flex-1 bg-white p-4 rounded shadow cursor-pointer text-center"
        >
          <h3 class="font-semibold">Rejected</h3>
          <p id="rejectedCount" class="text-xl font-bold mt-2">0</p>
        </div>
      </div>

      <!-- Jobs Container -->
      <div id="jobsContainer" class="grid gap-6"></div>
    </section>

    <!-- Jobs Container -->
    <section>
      <div
        id="jobContainer"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"
      ></div>
    </section>

    <!-- Script -->
    <script src="script.js"></script>
  </body>
</html>
